---
short_title: Presse
long_title: Presse
---
{% assign a = site.presse | reverse %}
{% for t in a %}
    <div style="margin:auto; overflow:auto; ">
        <h3>{{ t.title }}</h3>

        {% if t.pdf %}
        <a href="{{ t.pdf }}"><img src="pdf.jpg" class="right" width="20%" alt="PDF"></a>
        {% endif %}

        {% if t.image %}
        <img src="{{ t.image }}" class="right" width="20%">
        {% endif %}
        {% if t.content != "" %}
        <p>{{ t.content | markdownify }}</p>
        {% endif %}
    </div>
{% endfor %}
